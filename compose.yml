services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: searchpilot
      POSTGRES_PASSWORD: searchpilot
      POSTGRES_DB: searchpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - searchpilot_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  searchpilot_pg:
